<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5F6F8">
  <meta name="color-scheme" content="light">
  <title>自习室 · 座位预约</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/styles.css?v=20261127k">
</head>
<body>
  <div id="boot" class="boot" aria-hidden="true"><span class="spinner"></span></div>

  <section id="login" class="login" hidden>
    <header class="login-header">
      <div class="login-brand">
        <span class="login-logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 10V7.5A2.5 2.5 0 0 1 7.5 5h9A2.5 2.5 0 0 1 19 7.5V10"/>
            <path d="M4 12.5A1.5 1.5 0 0 1 5.5 11h13A1.5 1.5 0 0 1 20 12.5V16H4z"/>
            <path d="M6 16v3M18 16v3"/>
          </svg></span>
        <div class="login-brand-text">
          <strong>智慧自习室预约管理系统</strong>
          <small>图书馆 · 座位预约</small>
        </div>
      </div>
      <span class="login-scope">校内系统</span>
    </header>

    <div class="login-stage">
      <div class="login-stage-inner">
      <div class="login-panel">
        <h2>登录</h2>
        <p class="login-sub">使用学号 / 工号与密码进入系统</p>
        <form id="loginForm" class="login-form" novalidate>
          <label class="field">
            <span>学号 / 工号</span>
            <input id="username" name="username" autocomplete="username" spellcheck="false" required>
          </label>
          <label class="field">
            <span>密码</span>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
          </label>
          <button class="btn btn-primary btn-block" id="loginBtn" type="submit">登录</button>
          <p class="form-error" id="loginError" hidden></p>
        </form>
        <p class="login-help">首次登录需修改初始密码；忘记密码请联系管理员。</p>
      </div>

      <aside class="login-notice">
        <h3>使用须知</h3>
        <ul>
          <li>使用学号 / 工号与密码登录。</li>
          <li>首次登录需修改初始密码。</li>
          <li>预约、签到与违约规则以系统公告为准。</li>
        </ul>
        <p>仅面向本校师生开放，账号由管理员创建。</p>
      </aside>
      </div>
    </div>

    <footer class="login-footer">智慧自习室预约管理系统 · 校内私有部署</footer>
  </section>

  <div id="app" class="app" hidden>
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark small" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 10V7.5A2.5 2.5 0 0 1 7.5 5h9A2.5 2.5 0 0 1 19 7.5V10"/>
            <path d="M4 12.5A1.5 1.5 0 0 1 5.5 11h13A1.5 1.5 0 0 1 20 12.5V16H4z"/>
            <path d="M6 16v3M18 16v3"/>
          </svg>
        </span>
        <span class="brand-name">自习室</span>
      </div>
      <nav class="nav" id="nav" aria-label="主导航"></nav>
      <div class="sidebar-footer" id="userCard"></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-titles">
          <h1 id="pageTitle">找座位</h1>
          <p id="pageSubtitle">按日期与时段查看空闲座位</p>
        </div>
        <div class="topbar-actions">
          <button class="icon-btn" id="bellBtn" type="button" aria-label="消息">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10.3 21a2 2 0 0 0 3.4 0"/></svg>
            <span class="badge" id="bellBadge" hidden></span>
          </button>
          <button class="user-chip" id="userChip" type="button">
            <span class="avatar" id="avatar">张</span>
            <span class="user-meta"><strong id="userName">张伟</strong><small id="userRole">学生</small></span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
          </button>
        </div>
      </header>
      <div id="view" class="view" role="main"></div>
    </main>
  </div>

  <div id="overlay" class="overlay" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/static/app.js?v=web-only-4" defer></script>
</body>
</html>
